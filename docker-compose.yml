services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: korvexa
      POSTGRES_PASSWORD: korvexa
      POSTGRES_DB: korvexa
    ports:
      - "5432:5432"
    volumes:
      - korvexa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korvexa -d korvexa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  korvexa_db_data:
